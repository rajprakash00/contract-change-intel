name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Same image/version as local docker-compose so tests hit an identical Postgres.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Lint and format check
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Typecheck
        run: uv run mypy app migrations/env.py

      - name: Tests
        # The runner has no port conflict, so its Postgres service stays on 5432;
        # locally we use host port 5433 (see docker-compose.yml).
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/cci
        run: uv run pytest -q
