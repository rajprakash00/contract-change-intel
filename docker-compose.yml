# Local development database only.
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cci
    ports:
      # Container stays on 5432; the HOST side is 5433 because of another project's Postgres
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cci"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
